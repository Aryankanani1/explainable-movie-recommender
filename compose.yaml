services:
  postgres:
    image: 'postgres:17'
    environment:
      - 'POSTGRES_DB=recsys'
      - 'POSTGRES_USER=recsys'
      - 'POSTGRES_PASSWORD=recsys'
    # Host port 5433: a native PostgreSQL already listens on 5432 on the dev machine.
    ports:
      - '5433:5432'
    volumes:
      - 'pgdata:/var/lib/postgresql/data'

volumes:
  pgdata:
