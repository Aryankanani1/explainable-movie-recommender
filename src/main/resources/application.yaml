spring:
  application:
    name: movie-recommender
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 500
        order_inserts: true
        default_batch_fetch_size: 100
  mvc:
    problemdetails:
      enabled: true
  jackson:
    deserialization:
      # Grades are whole numbers; without this, {"score": 8.5} is silently stored as 8.
      accept-float-as-int: false

recsys:
  data-dir: data/ml-latest-small
  import:
    enabled: true
  recommend:
    default-k: 10
    # β for the improved method's tag block; 0 until ticket 04 adds tag features (then 0.5).
    tag-weight: 0.0
