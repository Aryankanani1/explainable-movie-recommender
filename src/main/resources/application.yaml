spring:
  application:
    name: movie-recommender
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 500
        order_inserts: true
        default_batch_fetch_size: 100
  jackson:
    deserialization:
      # Grades are whole numbers; without this, {"score": 8.5} is silently stored as 8.
      accept-float-as-int: false

recsys:
  data-dir: data/ml-latest-small
  import:
    enabled: true
  recommend:
    default-k: 10
    # β: how much the tag block counts relative to the genre block in the improved method. 0 = genres only:
    # the offline evaluation's validation search chose β = 0 (tags at 0.5 lowered NDCG@10; see results/metrics.md).
    tag-weight: 0.0
    # MMR re-ranks this many top candidates when diversity (lambda < 1) is on.
    mmr-pool: 100
    # Fewer grades than this: recommendations are popular films, flagged as a fallback.
    min-grades: 5
