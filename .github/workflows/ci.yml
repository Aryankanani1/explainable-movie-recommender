name: CI

on:
  push:
  workflow_dispatch:

jobs:
  verify:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Unit tests, then the Testcontainers integration tests (the runner has Docker).
      - run: ./mvnw -B verify

  docker:
    name: Full stack in Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The ticket's "docker compose up from a clean clone", on a clean clone.
      - run: docker compose up --build --detach --wait
      - run: node scripts/smoke-test.mjs http://localhost:8080
      - name: App logs
        if: always()
        run: docker compose logs app
